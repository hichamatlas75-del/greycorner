<body>

<div class="hero">

  <!-- BACKGROUND IMAGE -->
  <div class="bg"></div>

  <!-- OVERLAY -->
  <div class="overlay"></div>

  <!-- PARTICLES -->
  <canvas id="particles"></canvas>

  <!-- CONTENT -->
  <div class="content">

    <div class="logo"></div>

    <h1>Grey Corner</h1>
    <p id="subtitle">Fès • Café • Expérience</p>

    <a href="https://menugreycorner.pages.dev/" class="btn">
      Voir le Menu
    </a>

  </div>

</div>

<style>
body{
  margin:0;
  font-family:'Playfair Display', serif;
  background:#000;
  overflow:hidden;
}

/* BG */
.bg{
  position:absolute;
  inset:0;
  background:url('images/bg.jpg') center/cover no-repeat;
  filter:blur(8px) brightness(0.6);
  transform:scale(1.1);
}

/* OVERLAY */
.overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.8));
}

/* PARTICLES */
#particles{
  position:absolute;
  inset:0;
}

/* CONTENT */
.content{
  position:relative;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* LOGO */
.logo{
  width:70px;
  height:70px;
  border-radius:20px;
  background:#000;
  margin-bottom:20px;
}

/* TITLE */
h1{
  font-size:34px;
  color:#f5e7c4;
  margin-bottom:8px;
}

/* SUBTITLE */
p{
  color:#bbb;
  font-size:13px;
  margin-bottom:40px;
}

/* BUTTON */
.btn{
  padding:14px 32px;
  border-radius:40px;
  background:linear-gradient(135deg,#D4AF37,#F3E5AB);
  color:#000;
  text-decoration:none;
  font-weight:600;
  box-shadow:0 8px 25px rgba(212,175,55,0.4);
  transition:0.2s;
}

.btn:active{
  transform:scale(0.96);
}

/* MOBILE OPTIM */
*{
  -webkit-tap-highlight-color: transparent;
}
</style>

<script>
// PARTICULES LIGHT (plus fluide)
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<30;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*1.5,
    d:Math.random()*0.5
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="rgba(212,175,55,0.6)";
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    p.y+=p.d;
    if(p.y>canvas.height){
      p.y=0;
      p.x=Math.random()*canvas.width;
    }
  });
}

setInterval(draw,40);

// LANG AUTO
const lang = navigator.language.slice(0,2);
const texts = {
  fr:{sub:"Fès • Café • Expérience",btn:"Voir le Menu"},
  en:{sub:"Fes • Coffee • Experience",btn:"View Menu"},
  ar:{sub:"فاس • كافيه • تجربة",btn:"عرض القائمة"}
};

const t = texts[lang] || texts.fr;
document.getElementById("subtitle").textContent = t.sub;
document.querySelector(".btn").textContent = t.btn;

// TRANSITION RAPIDE
document.querySelector(".btn").addEventListener("click",function(e){
  e.preventDefault();
  document.body.style.opacity="0";
  setTimeout(()=>{window.location=this.href},250);
});
</script>

</body>
