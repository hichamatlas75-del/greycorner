<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
<title>Grey Corner • Menus</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#0f1115;
  --bg2:#0a0c10;

  --card:#1a1d23;
  --card2:#262a33;

  --gold:#d4af37;
  --gold-soft:rgba(212,175,55,.25);

  --text:#f2f2f2;
  --muted:rgba(242,242,242,.65);

  --radius:26px;
}

*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;
  min-height:100vh;
  font-family:"Poppins",sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 600px at 15% -10%, rgba(212,175,55,.12), transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg2));
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px 12px;
  overflow-x:hidden;
  overflow-y:auto;
}

.wrap{width:min(560px,100%)}

.card{
  border-radius:var(--radius);
  background:linear-gradient(180deg,var(--card),var(--bg2));
  border:1px solid rgba(255,255,255,.06);
  box-shadow:0 28px 80px rgba(0,0,0,.75);
  overflow:hidden;
  position:relative;
}

.top{
  padding:18px 16px 12px;
  display:flex;
  gap:12px;
  align-items:center;
}

.logo{
  width:62px;height:62px;
  border-radius:20px;
  overflow:hidden;
  border:1px solid var(--gold-soft);
  box-shadow:0 10px 25px rgba(0,0,0,.5);
  background:#111317;
  flex:0 0 auto;
}
.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

h1{
  margin:0;
  font-family:"Playfair Display",serif;
  font-size:22px;
  letter-spacing:.4px;
}
.sub{
  margin-top:6px;
  font-size:13px;
  color:var(--muted);
}

.divider{
  height:1px;
  margin:0 14px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.5;
}

.content{padding:14px}

.welcome{
  padding:14px;
  border-radius:20px;
  background:var(--card2);
  border:1px solid rgba(255,255,255,.06);
  margin-bottom:14px;
}
.welcome b{
  color:var(--gold);
  font-family:"Playfair Display",serif;
}
.welcome p{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}

.grid{display:grid;gap:12px}

.btn{
  text-decoration:none;
  color:var(--text);
  border-radius:22px;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg,var(--card2),var(--card));
  transition:transform .18s ease, border-color .18s ease, filter .18s ease;
  position:relative;
  overflow:hidden;
  box-shadow:0 14px 40px rgba(0,0,0,.6);
  -webkit-tap-highlight-color: transparent;
}

.btn:active{
  transform:scale(.97);
  border-color:var(--gold-soft);
}

.btn::after{
  content:"";
  position:absolute;
  inset:-40% -60%;
  background:linear-gradient(90deg,
    transparent,
    rgba(212,175,55,.18),
    rgba(212,175,55,.35),
    transparent);
  transform:rotate(12deg) translateX(-30%);
  opacity:.4;
  pointer-events:none;
}

.tag{
  font-size:11px;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:rgba(242,242,242,.6);
}
.label{
  margin-top:6px;
  font-size:18px;
  font-weight:700;
}
.hint{
  margin-top:6px;
  font-size:12.5px;
  color:rgba(242,242,242,.7);
}

.icon{
  width:48px;height:48px;
  border-radius:18px;
  display:grid;
  place-items:center;
  border:1px solid var(--gold-soft);
  background:#111317;
  flex:0 0 auto;
}
.icon svg{
  width:22px;height:22px;
  stroke:var(--gold);
  stroke-width:2;
  fill:none;
}

.foot{
  padding:12px 14px 16px;
  text-align:center;
  font-size:12px;
  color:rgba(242,242,242,.5);
}

/* ====== VIEW (menu in-page) ====== */
.menu-view{
  position:fixed;
  inset:0;
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  display:none;            /* shown via JS */
  flex-direction:column;
  z-index:999;
  opacity:0;
  transform:translateX(14px);
  transition:opacity .22s ease, transform .22s ease;
}
.menu-view.show{
  display:flex;
}
.menu-view.on{
  opacity:1;
  transform:translateX(0);
}

.menu-bar{
  padding:12px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(10,12,16,.85);
  backdrop-filter: blur(10px);
}

.back-btn{
  appearance:none;
  border:1px solid rgba(212,175,55,.45);
  background:rgba(212,175,55,.08);
  color:var(--gold);
  padding:10px 14px;
  border-radius:14px;
  font-weight:700;
  font-family:"Poppins",sans-serif;
  cursor:pointer;
}

.bar-title{
  font-weight:700;
  letter-spacing:.2px;
  color:var(--text);
  font-size:14px;
  opacity:.95;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.frame{
  flex:1;
  width:100%;
  border:0;
  background:#0a0c10;
}

/* Mobile tightening */
@media (max-width:360px){
  h1{font-size:20px}
  .logo{width:56px;height:56px;border-radius:18px}
  .btn{padding:14px;border-radius:20px}
  .label{font-size:17px}
}
</style>
</head>

<body>

<div class="wrap" id="homeWrap">
  <div class="card">

    <div class="top">
      <div class="logo">
        <img src="images/logo.png" alt="Grey Corner Logo">
      </div>
      <div>
        <h1>Grey Corner • Fès</h1>
        <div class="sub">Sélectionnez un menu</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="content">
      <div class="welcome">
        <p><b>Bienvenue</b><br>Accès direct aux menus officiels Grey Corner.</p>
      </div>

      <div class="grid">
        <a class="btn nav-link" href="https://ramadan-greycorner.pages.dev/" data-title="Menu Ramadan">
          <div>
            <div class="tag">Menu</div>
            <div class="label">Ramadan</div>
            <div class="hint">Formules Ftour & Offres spéciales</div>
          </div>
          <div class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.6A8.5 8.5 0 1 1 11.4 3a6.5 6.5 0 1 0 9.6 9.6Z"/>
            </svg>
          </div>
        </a>

        <a class="btn nav-link" href="https://greycornerfes.pages.dev/" data-title="Menu Principal">
          <div>
            <div class="tag">Menu</div>
            <div class="label">Menu Principal</div>
            <div class="hint">Café, boissons, snacks & plats</div>
          </div>
          <div class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 8h10v6a5 5 0 0 1-5 5H7V8Z"/>
              <path d="M17 9h2a3 3 0 1 1 0 6h-2"/>
            </svg>
          </div>
        </a>
      </div>
    </div>

    <div class="foot">© Grey Corner</div>
  </div>
</div>

<!-- ===== In-page Menu Viewer (iframe) ===== -->
<div class="menu-view" id="menuView" aria-hidden="true">
  <div class="menu-bar">
    <button class="back-btn" id="backBtn" type="button">← Retour</button>
    <div class="bar-title" id="barTitle">Menu</div>
  </div>
  <iframe class="frame" id="menuFrame" title="Menu Grey Corner"></iframe>
</div>

<script>
const links = document.querySelectorAll('.nav-link');
const menuView = document.getElementById('menuView');
const frame = document.getElementById('menuFrame');
const backBtn = document.getElementById('backBtn');
const barTitle = document.getElementById('barTitle');

let menuOpen = false;

function openMenu(url, title){
  // show overlay
  menuView.classList.add('show');
  requestAnimationFrame(()=> menuView.classList.add('on'));

  // load
  frame.src = url;
  barTitle.textContent = title || "Menu";

  // push state so Android back works
  if (!menuOpen) {
    history.pushState({menu:true}, "", "#menu");
  }
  menuOpen = true;
  menuView.setAttribute("aria-hidden","false");
}

function closeMenu(fromPopstate=false){
  // animate out
  menuView.classList.remove('on');
  menuView.setAttribute("aria-hidden","true");

  setTimeout(()=>{
    menuView.classList.remove('show');
    frame.src = "about:blank";
  }, 220);

  if (menuOpen && !fromPopstate) history.back();
  menuOpen = false;
}

links.forEach(link=>{
  link.addEventListener('click', (e)=>{
    // allow new tab / special clicks
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;

    e.preventDefault();
    openMenu(link.href, link.dataset.title);
  });
});

backBtn.addEventListener('click', ()=> closeMenu(false));

// If user presses Android back or browser back
window.addEventListener('popstate', (e)=>{
  if (menuOpen) closeMenu(true);
});
</script>

</body>
</html>
