<body>

<div class="hero">

  <!-- VIDEO BACKGROUND -->
  <video autoplay muted loop playsinline class="bg-video" id="bgVideo">
    <source src="video/cafe.mp4" type="video/mp4">
  </video>

  <!-- FALLBACK IMAGE -->
  <div class="bg-fallback"></div>

  <!-- OVERLAY -->
  <div class="overlay"></div>

  <!-- PARTICULES -->
  <canvas id="particles"></canvas>

  <!-- CONTENU -->
  <div class="content">

    <div class="logo-box">
      <img src="images/logo.png" alt="Grey Corner">
    </div>

    <h1>Grey Corner</h1>
    <p class="subtitle" id="subtitle">Fès • Coffee • Experience</p>

    <a href="https://menugreycorner.pages.dev/" class="cta-btn nav-link" id="cta">
      Voir le Menu
    </a>

  </div>

</div>

<style>
body{
  margin:0;
  font-family:'Plus Jakarta Sans',sans-serif;
  background:#000;
  overflow:hidden;
}

/* VIDEO */
.bg-video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-3;
  filter:brightness(0.45);
}

/* FALLBACK IMAGE */
.bg-fallback{
  position:absolute;
  inset:0;
  background:url('images/bg.jpg') center/cover no-repeat;
  z-index:-4;
}

/* OVERLAY */
.overlay{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%, rgba(212,175,55,0.2), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(212,175,55,0.1), transparent 40%),
    rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  z-index:-2;
}

/* PARTICLES */
#particles{
  position:absolute;
  inset:0;
  z-index:-1;
}

/* CONTENT */
.content{
  position:relative;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  animation:fadeUp 1.2s ease;
}

/* LOGO */
.logo-box{
  width:110px;
  height:110px;
  border-radius:30px;
  overflow:hidden;
  margin-bottom:20px;
  box-shadow:0 20px 60px rgba(0,0,0,0.8);
  animation:float 6s ease-in-out infinite;
}

/* TITLE */
h1{
  font-family:"Playfair Display",serif;
  font-size:46px;
  background:linear-gradient(to right,#fff,#D4AF37);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* SUBTITLE */
.subtitle{
  color:#ccc;
  margin-bottom:50px;
  letter-spacing:3px;
  font-size:13px;
}

/* BUTTON */
.cta-btn{
  padding:18px 46px;
  border-radius:50px;
  text-decoration:none;
  font-weight:600;
  background:linear-gradient(135deg,#D4AF37,#F3E5AB);
  color:#000;
  box-shadow:0 10px 40px rgba(212,175,55,0.5);
  transition:0.4s;
}

.cta-btn:hover{
  transform:scale(1.1);
  box-shadow:0 20px 60px rgba(212,175,55,0.7);
}

/* ANIMATIONS */
@keyframes fadeUp{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes float{
  0%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
  100%{transform:translateY(0);}
}

/* MOBILE */
@media(max-width:480px){
  h1{font-size:34px;}
  .logo-box{width:90px;height:90px;}
}
</style>

<script>
// ================= PARTICULES OR =================
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<60;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2,
    d:Math.random()*1
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="rgba(212,175,55,0.6)";
  ctx.beginPath();
  for(let i=0;i<particles.length;i++){
    let p = particles[i];
    ctx.moveTo(p.x,p.y);
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2,true);
  }
  ctx.fill();
  update();
}

function update(){
  for(let i=0;i<particles.length;i++){
    let p = particles[i];
    p.y += p.d;
    if(p.y > canvas.height){
      p.y = 0;
      p.x = Math.random()*canvas.width;
    }
  }
}

setInterval(draw,33);

// ================= LANG AUTO =================
const lang = navigator.language.slice(0,2);

const texts = {
  fr:{sub:"Fès • Café • Expérience",btn:"Voir le Menu"},
  en:{sub:"Fes • Coffee • Experience",btn:"View Menu"},
  ar:{sub:"فاس • كافيه • تجربة",btn:"عرض القائمة"}
};

const t = texts[lang] || texts.fr;
document.getElementById("subtitle").textContent = t.sub;
document.getElementById("cta").textContent = t.btn;

// ================= TRANSITION =================
document.querySelector('.cta-btn').addEventListener('click',function(e){
  e.preventDefault();
  document.body.style.opacity="0";
  setTimeout(()=>{window.location=this.href},500);
});

// ================= VIDEO FALLBACK =================
const video = document.getElementById("bgVideo");
video.addEventListener("error",()=>{
  video.style.display="none";
});
</script>

</body>
