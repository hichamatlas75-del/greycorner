<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grey Corner Fès</title>
    <style>
        :root {
            --primary-gold: #D4AF37;
            --bg-dark: #0a090b;
            --text-gray: #aaa;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #1a191c 0%, var(--bg-dark) 100%);
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            opacity: 0; /* Pour l'effet d'entrée */
            animation: fadeIn 0.8s forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .app-container {
            width: 100%;
            max-width: 340px;
            padding: 20px;
            text-align: center;
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 28px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        #subtitle {
            color: var(--text-gray);
            font-size: 14px;
            margin-bottom: 48px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            border-radius: 50px;
            background: var(--primary-gold);
            color: #000;
            text-decoration: none;
            font-weight: 600;
            font-size: 17px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.96);
            background: #b8972f;
        }

        /* Mobile Optimization */
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        [dir="rtl"] #subtitle { font-family: sans-serif; }
    </style>
</head>
<body>

<div class="app-container">
    <img src="images/logo.png" alt="Grey Corner Logo" class="logo">
    <h1>Grey Corner</h1>
    <p id="subtitle">Fès • Café • Expérience</p>
    <a href="https://menugreycorner.pages.dev/" class="btn" id="main-btn">
        Voir le Menu
    </a>
</div>

<script>
    const texts = {
        fr: { sub: "Fès • Café • Expérience", btn: "Voir le Menu" },
        en: { sub: "Fes • Coffee • Experience", btn: "View Menu" },
        ar: { sub: "فاس • كافيه • تجربة", btn: "عرض القائمة" }
    };

    // Détection langue
    const userLang = navigator.language.slice(0, 2);
    const content = texts[userLang] || texts.fr;

    // Mise à jour du texte
    const subtitle = document.getElementById("subtitle");
    const btn = document.getElementById("main-btn");

    subtitle.textContent = content.sub;
    btn.textContent = content.btn;

    // Gestion de la direction pour l'arabe
    if (userLang === 'ar') {
        document.body.setAttribute('dir', 'rtl');
    }

    // Transition de sortie fluide
    btn.addEventListener("click", function(e) {
        e.preventDefault();
        const target = this.href;
        document.body.style.transition = "opacity 0.4s ease";
        document.body.style.opacity = "0";
        setTimeout(() => { window.location.href = target; }, 400);
    });
</script>

</body>
</html>
