<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grey Corner Fès</title>

    <style>
        :root {
            --gold: #D4AF37;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            /* Fix pour les navigateurs mobiles modernes */
            height: 100dvh; 
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- VIDÉO & FOND --- */
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
            /* Fallback couleur si tout échoue */
            background-color: #000; 
        }

        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5); /* Légèrement plus sombre pour le luxe */
            z-index: -1;
        }

        /* --- CONTENU --- */
        .content {
            text-align: center;
            z-index: 10;
            width: 90%;
            max-width: 350px;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(212,175,55,0.4);
            object-fit: cover;
        }

        h1 {
            font-size: 34px;
            margin: 0;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.8);
        }

        p {
            color: #ccc;
            font-size: 15px;
            margin: 10px 0 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- BOUTON --- */
        .btn-menu {
            display: block;
            background: var(--gold);
            color: #000;
            text-decoration: none;
            padding: 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            transition: transform 0.2s, background 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .btn-menu:active {
            transform: scale(0.96);
            background: #b8952d;
        }

        /* --- LANGUES --- */
        .lang-switcher {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .lang-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lang-btn.active {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(212,175,55,0.1);
        }
    </style>
</head>

<body>

<div id="video-container">
    <video id="bg-video" autoplay loop muted playsinline webkit-playsinline preload="auto" poster="images/bg.jpg">
        <source src="video/cafe.mp4" type="video/mp4">
    </video>
</div>

<div class="overlay"></div>

<div class="content">
    <img src="images/logo.png" class="logo" alt="Grey Corner Logo">
    <h1>Grey Corner</h1>
    <p id="subtitle">Fès • Café • Restaurant</p>

    <a href="https://menugreycorner.pages.dev/" class="btn-menu" id="menu-btn">
        Voir le Menu
    </a>

    <div class="lang-switcher">
        <button class="lang-btn active" data-lang="fr" onclick="setLang('fr')">FR</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" data-lang="de" onclick="setLang('de')">DE</button>
    </div>
</div>

<script>
    const video = document.getElementById('bg-video');

    /* GESTION DES LANGUES */
    const translations = {
        fr: { sub: "Fès • Café • Restaurant", btn: "Voir le Menu" },
        en: { sub: "Fes • Coffee • Restaurant", btn: "View Menu" },
        de: { sub: "Fes • Kaffee • Restaurant", btn: "Menü anzeigen" }
    };

    function setLang(lang) {
        if (!translations[lang]) return;

        document.getElementById('subtitle').innerText = translations[lang].sub;
        document.getElementById('menu-btn').innerText = translations[lang].btn;

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-lang') === lang) btn.classList.add('active');
        });
    }

    /* AUTO-DETECTION ET FORCE PLAY */
    window.addEventListener('load', () => {
        // Détection langue navigateur
        const userLang = navigator.language.slice(0,2);
        if (translations[userLang]) setLang(userLang);

        // Tentative de lecture forcée pour mobile
        video.play().catch(error => {
            console.log("Lecture auto bloquée par le navigateur, l'utilisateur doit interagir.");
        });
    });

    // Relance la vidéo au premier clic si bloquée
    document.addEventListener('touchstart', () => video.play(), { once: true });
</script>

</body>
</html>
