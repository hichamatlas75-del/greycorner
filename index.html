<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grey Corner Fès</title>
    <style>
        :root {
            --gold: #D4AF37;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- VIDÉO ARRIÈRE-PLAN --- */
        #video-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            overflow: hidden;
        }

        #bg-video {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Ajustez ici pour éclaircir/assombrir la vidéo */
            z-index: -1;
        }

        /* --- CONTENU --- */
        .content {
            text-align: center;
            z-index: 10;
            width: 90%;
            max-width: 350px;
        }

        .logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            margin-bottom: 25px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }

        h1 { font-size: 34px; margin: 0; font-weight: 700; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
        p { color: #eee; font-size: 15px; margin: 10px 0 45px; letter-spacing: 1px; text-shadow: 1px 1px 5px rgba(0,0,0,0.8); }

        /* --- BOUTON MENU --- */
        .btn-menu {
            display: block;
            background: var(--gold);
            color: #000;
            text-decoration: none;
            padding: 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 19px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

        .btn-menu:active { transform: scale(0.97); }

        /* --- LANGUES --- */
        .lang-switcher {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .lang-btn {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }

        .lang-btn.active {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video autoplay loop muted playsinline id="bg-video">
            <source src="video/cafe.mp4" type="video/mp4">
        </video>
    </div>

    <div class="overlay"></div>

    <div class="content">
        <img src="images/logo.png" class="logo" alt="Grey Corner Logo">
        <h1>Grey Corner</h1>
        <p id="subtitle">Fès • Café • Restaurant</p>
        
        <a href="https://menugreycorner.pages.dev/" class="btn-menu" id="menu-btn">
            Voir le Menu
        </a>

        <div class="lang-switcher">
            <button class="lang-btn active" onclick="setLang('fr')">FR</button>
            <button class="lang-btn" onclick="setLang('en')">EN</button>
            <button class="lang-btn" onclick="setLang('de')">DE</button>
        </div>
    </div>

    <script>
        const translations = {
            fr: { sub: "Fès • Café • Restaurant", btn: "Voir le Menu" },
            en: { sub: "Fes • Coffee • Restaurant", btn: "View Menu" },
            de: { sub: "Fes • Kaffee • Restaurant", btn: "Menü anzeigen" }
        };

        function setLang(lang) {
            document.getElementById('subtitle').innerText = translations[lang].sub;
            document.getElementById('menu-btn').innerText = translations[lang].btn;

            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase() === lang) btn.classList.add('active');
            });
        }

        // Force la lecture sur mobile si le navigateur bloque l'autoplay
        window.addEventListener('touchstart', function() {
            const video = document.getElementById('bg-video');
            if (video.paused) video.play();
        }, {once: true});

        // Détection auto
        const userLang = navigator.language.slice(0, 2);
        if (translations[userLang]) setLang(userLang);
    </script>
</body>
</html>
