<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grey Corner Fès</title>

    <style>
        :root {
            --gold: #D4AF37;
            --gold-dark: #b8952d;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            /* On vire TOUT fond par défaut ici pour ne plus être gêné */
            background: transparent !important;
        }

        /* ── CONTAINER VIDÉO ── (doit absolument couvrir tout) */
        #video-bg-wrap {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
            z-index: -10;               /* très bas */
            background: #000;           /* fallback temporaire si vidéo rate */
            overflow: hidden;
        }

        #bg-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;          /* ESSENTIEL */
            object-position: center;
            pointer-events: none;
        }

        /* Overlay sombre (ajustable) */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.78);
            z-index: -5;
        }

        /* ── Contenu principal ── */
        .content {
            position: relative;
            z-index: 20;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 15px;
            animation: fadeIn 1.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2.5px solid var(--gold);
            margin-bottom: 35px;
            box-shadow: 0 0 50px rgba(212,175,55,0.3);
            object-fit: cover;
        }

        h1 {
            font-size: clamp(2.1rem, 8vw, 3.2rem);
            margin: 0 0 0.3em;
            font-weight: 900;
            letter-spacing: 1.8px;
            text-shadow: 0 4px 25px rgba(0,0,0,0.95);
        }

        #subtitle {
            color: #e0e0e0;
            font-size: clamp(0.95rem, 4.2vw, 1.15rem);
            margin: 0 0 3em;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .btn-menu {
            display: inline-block;
            background: var(--gold);
            color: #000;
            text-decoration: none;
            padding: 17px 45px;
            border-radius: 60px;
            font-weight: 800;
            font-size: 1.1rem;
            transition: all 0.28s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .btn-menu:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(0,0,0,0.55); }
        .btn-menu:active { transform: scale(0.96); background: var(--gold-dark); }

        .lang-switcher {
            margin-top: 60px;
            display: flex;
            gap: 14px;
        }

        .lang-btn {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lang-btn.active {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(212,175,55,0.15);
        }

        @media (max-width: 480px) {
            .logo { width: 120px; height: 120px; margin-bottom: 25px; }
            h1 { font-size: 2.4rem; }
            .btn-menu { padding: 14px 38px; font-size: 1rem; }
            .lang-switcher { gap: 10px; }
            .lang-btn { padding: 9px 15px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<!-- Vidéo en ABSOLU et FULL COVER -->
<div id="video-bg-wrap">
    <video id="bg-video"
           autoplay
           loop
           muted
           playsinline
           preload="metadata"
           poster="images/bg.jpg">
        <source src="video/cafe.mp4" type="video/mp4">
    </video>
</div>

<div class="overlay"></div>

<div class="content">
    <img src="images/logo.png" class="logo" alt="Grey Corner Logo">
    <h1>Grey Corner</h1>
    <p id="subtitle">Fès • Café • Restaurant</p>

    <a href="https://menugreycorner.pages.dev/" class="btn-menu" id="menu-btn">
        Voir le Menu
    </a>

    <div class="lang-switcher">
        <button class="lang-btn active" data-lang="fr" onclick="setLang('fr')">FR</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" data-lang="de" onclick="setLang('de')">DE</button>
    </div>
</div>

<script>
    const video = document.getElementById('bg-video');

    const translations = {
        fr: { sub: "Fès • Café • Restaurant", btn: "Voir le Menu" },
        en: { sub: "Fes • Coffee • Restaurant", btn: "View Menu" },
        de: { sub: "Fes • Kaffee • Restaurant", btn: "Menü anzeigen" }
    };

    function setLang(lang) {
        if (!translations[lang]) return;
        document.getElementById('subtitle').textContent = translations[lang].sub;
        document.getElementById('menu-btn').textContent = translations[lang].btn;

        document.querySelectorAll('.lang-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.lang === lang);
        });
    }

    // Auto-langue + play forcé
    window.addEventListener('load', () => {
        const lang = navigator.language.slice(0,2);
        if (translations[lang]) setLang(lang);
        video.play().catch(e => console.log("Autoplay bloqué", e));
    });

    // Déblocage mobile au premier touch
    document.addEventListener('touchstart', () => video.play(), { once: true });
</script>

</body>
</html>
