<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grey Corner Fès</title>
    <style>
        :root {
            --gold: #D4AF37;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: 'Segoe UI', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* --- VIDÉO --- */
        #bg-video {
            position: fixed;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Ajuste la visibilité de la vidéo ici */
            z-index: -1;
        }

        /* --- CONTENU --- */
        .content {
            text-align: center;
            z-index: 10;
            width: 90%;
            max-width: 350px;
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        h1 { font-size: 32px; margin: 0; font-weight: 700; }
        p { color: #ccc; font-size: 14px; margin: 10px 0 40px; letter-spacing: 1px; }

        /* --- BOUTON MENU --- */
        .btn-menu {
            display: block;
            background: var(--gold);
            color: #000;
            text-decoration: none;
            padding: 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        /* --- BOUTONS LANGUES --- */
        .lang-switcher {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .lang-btn {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .lang-btn.active {
            border-color: var(--gold);
            color: var(--gold);
        }

        .lang-btn:hover { background: rgba(255,255,255,0.2); }

    </style>
</head>
<body>

    <video autoplay loop muted playsinline id="bg-video">
        <source src="video/cafe.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="content">
        <img src="images/logo.png" class="logo" alt="Logo">
        <h1 id="title">Grey Corner</h1>
        <p id="subtitle">Fès • Café • Restaurant</p>
        
        <a href="https://menugreycorner.pages.dev/" class="btn-menu" id="menu-btn">
            Voir le Menu
        </a>

        <div class="lang-switcher">
            <div class="lang-btn active" onclick="setLang('fr')">FR</div>
            <div class="lang-btn" onclick="setLang('en')">EN</div>
            <div class="lang-btn" onclick="setLang('de')">DE</div>
        </div>
    </div>

    <script>
        const translations = {
            fr: { sub: "Fès • Café • Restaurant", btn: "Voir le Menu" },
            en: { sub: "Fes • Coffee • Restaurant", btn: "View Menu" },
            de: { sub: "Fes • Kaffee • Restaurant", btn: "Menü anzeigen" }
        };

        function setLang(lang) {
            // Mise à jour textes
            document.getElementById('subtitle').innerText = translations[lang].sub;
            document.getElementById('menu-btn').innerText = translations[lang].btn;

            // Mise à jour style boutons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.innerText.toLowerCase() === lang) btn.classList.add('active');
            });
        }

        // Détection auto au démarrage
        const userLang = navigator.language.slice(0, 2);
        if (translations[userLang]) setLang(userLang);
    </script>
</body>
</html>
