<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grey Corner Fès</title>

    <style>
        :root {
            --gold: #D4AF37;
            --gold-dark: #b8952d;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            height: 100dvh;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
            background: #000; /* fallback très sombre */
        }

        /* ── VIDÉO DE FOND ── */
        #video-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
            /* Gradient à gauche + noir central/droite */
            background: linear-gradient(to right, #2a1c0a 0%, #1a1206 40%, #000 70%, #000 100%);
        }

        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -2;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.58); /* un peu plus fort pour contraste */
            z-index: -1;
        }

        /* ── CONTENU ── */
        .content {
            position: relative;
            z-index: 10;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            animation: fadeIn 1.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0);    }
        }

        .logo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            margin-bottom: 30px;
            box-shadow: 0 0 40px rgba(212,175,55,0.35);
            object-fit: cover;
        }

        h1 {
            font-size: clamp(28px, 7vw, 38px);
            margin: 0 0 0.4em;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-shadow: 0 3px 20px rgba(0,0,0,0.9);
        }

        p {
            color: #ddd;
            font-size: clamp(14px, 4vw, 16px);
            margin: 0 0 2.5em;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .btn-menu {
            display: inline-block;
            background: var(--gold);
            color: #000;
            text-decoration: none;
            padding: 16px 38px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 17px;
            transition: all 0.25s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.45);
        }

        .btn-menu:hover,
        .btn-menu:focus {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        }

        .btn-menu:active {
            transform: scale(0.97);
            background: var(--gold-dark);
        }

        .lang-switcher {
            margin-top: 50px;
            display: flex;
            gap: 12px;
        }

        .lang-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            padding: 9px 16px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lang-btn.active {
            border-color: var(--gold);
            color: var(--gold);
            background: rgba(212,175,55,0.12);
        }

        @media (max-width: 480px) {
            .logo   { width: 120px; height: 120px; }
            h1      { font-size: 30px; }
            .btn-menu { padding: 14px 32px; font-size: 16px; }
        }
    </style>
</head>
<body>

<div id="video-container">
    <video id="bg-video"
           autoplay
           loop
           muted
           playsinline
           preload="metadata"
           poster="images/bg.jpg">
        <source src="video/cafe.mp4" type="video/mp4">
    </video>
</div>

<div class="overlay"></div>

<div class="content">
    <img src="images/logo.png" class="logo" alt="Grey Corner Logo">
    <h1>Grey Corner</h1>
    <p id="subtitle">Fès • Café • Restaurant</p>

    <a href="https://menugreycorner.pages.dev/" class="btn-menu" id="menu-btn">
        Voir le Menu
    </a>

    <div class="lang-switcher">
        <button class="lang-btn active"   data-lang="fr" onclick="setLang('fr')">FR</button>
        <button class="lang-btn"         data-lang="en" onclick="setLang('en')">EN</button>
        <button class="lang-btn"         data-lang="de" onclick="setLang('de')">DE</button>
    </div>
</div>

<script>
    const video = document.getElementById('bg-video');

    const translations = {
        fr: { sub: "Fès • Café • Restaurant", btn: "Voir le Menu" },
        en: { sub: "Fes • Coffee • Restaurant", btn: "View Menu" },
        de: { sub: "Fes • Kaffee • Restaurant", btn: "Menü anzeigen" }
    };

    function setLang(lang) {
        if (!translations[lang]) return;

        document.getElementById('subtitle').textContent = translations[lang].sub;
        document.getElementById('menu-btn').textContent = translations[lang].btn;

        document.querySelectorAll('.lang-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.lang === lang);
        });
    }

    window.addEventListener('load', () => {
        const userLang = navigator.language.slice(0,2);
        if (translations[userLang]) setLang(userLang);

        video.play().catch(() => {});
    });

    document.addEventListener('touchstart', () => video.play(), { once: true });
</script>

</body>
</html>
